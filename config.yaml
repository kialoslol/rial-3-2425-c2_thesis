# MobileViT V3 Late Fusion Defect Detection — Configuration

# ── Dataset ──────────────────────────────────────────────────────────────────
dataset:
  # CVAT XML source annotations (used to regenerate COCO JSON if annotations are empty)
  xml_annotation: "ANNOTATED_DATA/fifthmerged_output.xml"

  # Directory that contains the COCO JSON files
  annotation_dir: "dataset"

  # COCO JSON files (relative to annotation_dir)
  train_annotation_file: "dataset/instances_train.json"
  val_annotation_file:   "dataset/instances_val.json"

  # Root directory for fused TIFF images (contains subfolders: fuse_Binondo, FUSED, Pasay-LP, Binondocropped)
  # Used by the Early Fusion and single-modal models; image file_names in COCO JSON are relative to this directory.
  fused_dir: "ANNOTATED_DATA"

  # Separate RGB / IRT image directories, matched by file stem.
  # Used by the Late Fusion models (models/late_fusion_v1, models/late_fusion_v2).
  rgb_dir: "RGB_FITTED"
  irt_dir: "IRT_FITTED"

  image_size:  384
  num_classes: 5           # 0=background 1=crack 2=spall 3=delamination 4=moisture
  num_workers: 4
  train_ratio: 0.8         # fraction of images used for training

# ── Class info ───────────────────────────────────────────────────────────────
classes:
  names:
    0: background
    1: crack
    2: spall
    3: delamination      # reserved — no annotations yet
    4: moisture
  # Weighted cross-entropy weights (higher = more attention to that class).
  # Background is down-weighted; rare defects up-weighted.
  weights: [0.2, 3.0, 2.0, 1.0, 3.0]

# ── Model ────────────────────────────────────────────────────────────────────
model:
  backbone:    "mobilevitv2_100"
  pretrained:  true
  hidden_dim:  512
  num_classes: 5

# ── Training ─────────────────────────────────────────────────────────────────
training:
  batch_size:               6      # 384px on RTX 3050 4GB; drop to 4 if OOM
  num_epochs:               300
  learning_rate:            0.0003
  weight_decay:             0.0001
  optimizer:                "adam"
  scheduler:                "cosine_warmup"
  scheduler_patience:       10
  scheduler_factor:         0.5
  gradient_clip:            1.0
  early_stopping_patience:  60
  val_frequency:            1

# ── Augmentation ─────────────────────────────────────────────────────────────
augmentation:
  enable:            true
  horizontal_flip:   true
  vertical_flip:     true
  random_rotate_90:  true
  shift_scale_rotate:
    shift_limit:  0.1
    scale_limit:  0.1
    rotate_limit: 15
    prob:         0.5
  color_jitter:
    brightness:  0.2
    contrast:    0.2
    saturation:  0.2
    hue:         0.1
    prob:        0.5
  gaussian_blur:
    blur_limit: [3, 5]
    prob:       0.3
  gaussian_noise:
    var_limit: [10.0, 50.0]
    prob:      0.3

# ── Checkpoints ──────────────────────────────────────────────────────────────
checkpoint:
  # Each models/<name>/train.py ignores this and saves to its own
  # models/<name>/checkpoints/ folder instead, so multiple models never
  # collide. This value is only a fallback for scripts that don't override it.
  save_dir:       "./checkpoints"
  # Only the top `keep_best_n` checkpoints (by validation score) are kept on disk.
  # Whenever a new checkpoint is saved and this limit is exceeded, the
  # lowest-scoring .pth file is deleted automatically.
  keep_best_n:    10

# ── Inference ────────────────────────────────────────────────────────────────
inference:
  checkpoint_path: "./models/early_fusion_v2/checkpoints/best_early_fusion_v2_epoch126.pth"
  output_dir:      "./predictions"

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:           "INFO"
  log_file:        "./logs/training.log"
  tensorboard:     false
  tensorboard_dir: "./runs"

# ── Device ───────────────────────────────────────────────────────────────────
device:
  use_cuda:        true
  mixed_precision: false
